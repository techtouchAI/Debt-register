<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151412" />
    <meta name="description" content="نظام إدارة المكتب - إدارة المخزن والعملاء والفواتير والديون - يعمل بدون انترنت" />
    <title>إدارة المكتب</title>
    <script>
      // تهيئة السمة قبل أول رسم: يمنع وميض النهار/الليل والشاشة السوداء عند البدء
      try {
        var t = localStorage.getItem('theme');
        var d = t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.style.backgroundColor = d ? '#151412' : '#f8f7f5';
      } catch (e) {}
    </script>
    <!-- الخط مدمج داخل التطبيق (src/main.tsx) — لا طلبات إنترنت إطلاقاً -->
  </head>
  <body class="font-cairo bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
