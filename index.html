<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151412" />
    <meta name="description" content="نظام إدارة المكتب الزراعي - إدارة المخزن والعملاء والفواتير والديون - يعمل بدون انترنت" />
    <title>إدارة المكتب الزراعي</title>
    <script>
      // تهيئة السمة قبل أول رسم: يمنع وميض النهار/الليل والشاشة السوداء عند البدء
      try {
        var t = localStorage.getItem('theme');
        var d = t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.style.backgroundColor = d ? '#151412' : '#f8f7f5';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- الخطوط غير حاجبة للرسم: لا تتعطل الواجهة عند العمل دون إنترنت -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet"></noscript>
  </head>
  <body class="font-cairo bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
