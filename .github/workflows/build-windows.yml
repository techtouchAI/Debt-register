name: Build Windows 10/11

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows 10/11 EXE (متوافق تمام)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Electron dependencies
        run: |
          npm install electron --save-dev
          npm install electron-builder --save-dev

      - name: Verify files
        run: |
          dir
          dir public
          dir electron
          type package.json
          type electron-builder.json

      - name: Build Web App
        run: npm run build

      - name: Verify dist
        run: dir dist

      - name: Build Windows Installer (NSIS) and Portable
        run: npx electron-builder --win --x64 --publish=never --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: List build outputs
        if: always()
        run: dir release

      - name: Upload Windows Installer (NSIS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgriOffice-Windows-Installer
          path: release/*Setup*.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Windows Portable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgriOffice-Windows-Portable
          path: release/*Portable*.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Upload All Windows Builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgriOffice-Windows-All
          path: release/
          retention-days: 30
          if-no-files-found: warn
