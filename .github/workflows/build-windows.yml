name: Build Windows 10/11

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows 10/11 EXE (متوافق تمام)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Electron dependencies
        run: |
          npm install electron --save-dev
          npm install electron-builder --save-dev

      - name: Verify files
        run: |
          dir
          dir public
          dir electron
          type package.json

      - name: Build Web App
        run: npm run build

      - name: Build Windows Portable
        run: npx electron-builder --win portable --x64 --publish=never --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build Windows Dir
        run: npx electron-builder --win dir --x64 --publish=never --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: List build outputs (robust)
        if: always()
        run: |
          echo "=== Root dir ==="
          dir
          echo "=== Dist ==="
          dir dist 2>&1 || echo "no dist"
          echo "=== Release ==="
          dir release 2>&1 || echo "no release folder, checking..."
          dir /s /b *.exe 2>&1 | head -n 20 || echo "no exe found"
          where electron-builder 2>&1 || echo "electron-builder not in PATH"
          echo "=== Searching for exe ==="
          powershell -Command "Get-ChildItem -Recurse -Filter *.exe | Select-Object FullName | Format-Table -AutoSize"
        continue-on-error: true

      - name: Upload Windows Builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgriOffice-Windows-10-11
          path: |
            release/
            dist/
            *.exe
            **/*.exe
          retention-days: 30
          if-no-files-found: warn
