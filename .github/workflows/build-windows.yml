name: Build Windows 10/11

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows 10/11 EXE (متوافق تمام)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Electron dependencies
        run: |
          npm install electron --save-dev
          npm install electron-builder --save-dev

      - name: Verify files
        run: |
          dir
          dir public
          dir electron
          type package.json

      - name: Build Web App
        run: npm run build

      - name: Build Windows Portable (no installer)
        run: npx electron-builder --win portable --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build Windows with dir target (fallback)
        run: npx electron-builder --win dir --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build Windows NSIS
        run: npx electron-builder --win nsis --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: List build outputs
        if: always()
        run: |
          dir
          dir dist
          dir release 2>&1 || echo "no release"
          dir dist_electron 2>&1 || echo "no dist_electron"

      - name: Upload Windows Builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgriOffice-Windows-10-11
          path: |
            release/
            dist_electron/
            dist/
          retention-days: 30
          if-no-files-found: warn
