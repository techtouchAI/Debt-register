name: Build All Platforms - Android + Windows 10/11 + Web

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-web:
    runs-on: ubuntu-latest
    name: Build Web PWA (Offline)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: AgriOffice-Web-PWA
          path: dist/
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/local-notifications --save
      - run: npm run build
      - run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AgriOffice-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    name: Build Windows 10/11
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm install electron electron-builder --save-dev
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: AgriOffice-Windows-10-11
          path: release/
          retention-days: 30
          if-no-files-found: warn

  release:
    runs-on: ubuntu-latest
    name: Create Release
    needs: [build-web, build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure
        run: ls -R artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            🌾 إدارة المكتب الزراعي - الإصدار ${{ github.ref_name }}

            ### 📦 التحميلات:
            - **Android APK**: يعمل بدون انترنت، حفظ في Download/AgriOffice/ مع التاريخ
            - **Windows 10/11**: مثبت NSIS + Portable، متوافق تمام
            - **Web PWA**: يعمل بدون انترنت، قابل للتثبيت

            ### ✨ المميزات:
            - مخزن، عملاء، فواتير ذكية، ديون، تسديدات، تقارير
            - نسخ احتياطي تلقائي في مجلد خاص بالتاريخ
            - إشعارات داخل وخارج التطبيق Android/Windows
            - بدون انترنت 100%

            ### 🔧 التثبيت:
            - Android: ثبت APK
            - Windows: شغل Setup.exe أو Portable.exe
            - Web: افتح dist/index.html
