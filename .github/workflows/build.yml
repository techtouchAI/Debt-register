name: Build all platforms

# موحّد: يبني ويتحقق من كل الأغلفة فعلياً (ويب PWA + أندرويد + ويندوز + Tauri).
# كل خطوة تحقق آلية على الناتج نفسه (APK/Hashs/ASAR) لا على المصدر فقط.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Tests & Shell audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit & integration tests
        run: npm test
      - name: تدقيق أغلفة التشغيل (Android/Windows/Tauri)
        run: npm run audit:shells
      - name: فحص صياغة ملفات Electron
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
      - name: تدقيق أمني للاعتماديات (فشل عند high/critical)
        run: npm audit --audit-level=high

  web:
    name: Build Web PWA
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify build integrity
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          # منع انحدار تقسيم الحزم: يجب ألا يعود الملف الرئيسي ضخماً
          MAIN_BUNDLE=$(ls -S dist/assets/index-*.js | sed -n 1p)
          SIZE=$(wc -c < "$MAIN_BUNDLE")
          if [ "$SIZE" -gt 400000 ]; then
            echo "::error title=Bundle regression::$MAIN_BUNDLE is $SIZE bytes (> 400 KB)"
            exit 1
          fi
          # منع انحدار الشاشة السوداء: الأصول يجب أن تكون بمسارات نسبية
          if grep -Eq '(src|href)="/assets' dist/index.html; then
            echo '::error title=Build regression::dist/index.html contains absolute /assets paths'
            exit 1
          fi
      - name: Package web artifact
        run: (cd dist && zip -qr ../OfficeManager-Web-PWA.zip .)
      - uses: actions/upload-artifact@v7
        with:
          name: OfficeManager-Web-PWA
          path: OfficeManager-Web-PWA.zip
          if-no-files-found: error
          retention-days: 30

  electron-smoke:
    name: Electron smoke test (واجهة حقيقية)
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: تشغيل التطبيق الحقيقي والتحقق من تحميل الواجهة والجسر
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 >/dev/null
          NODE_ENV=production xvfb-run -a npx electron . --smoke-test --no-sandbox | tee smoke.log
          grep -q "SMOKE_OK" smoke.log

  android:
    name: Android APK (signed)
    needs: web
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
      KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - name: Add and sync Capacitor Android
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
      - name: التحقق من تسجيل الإضافات الأصلية بعد cap sync
        run: |
          set -euo pipefail
          # أداة cap sync تقرأ الإضافات من dependencies/devDependencies فقط.
          # أي إضافة أصلية خارج هاتين القائمتين لا تُسجَّل، فلا تُبنى داخل الـ APK،
          # وحينها يعود زر الرجوع لسلوك النظام الافتراضي = إنهاء التطبيق فوراً.
          PLUGINS=android/app/src/main/assets/capacitor.plugins.json
          test -f "$PLUGINS"
          cat "$PLUGINS"
          grep -q 'com.capacitorjs.plugins.app.AppPlugin' "$PLUGINS"
          grep -q 'com.capacitorjs.plugins.filesystem.FilesystemPlugin' "$PLUGINS"
          grep -q 'com.capacitorjs.plugins.localnotifications.LocalNotificationsPlugin' "$PLUGINS"
          grep -q 'com.capacitorjs.plugins.share.SharePlugin' "$PLUGINS"
          grep -q 'com.capacitorjs.plugins.browser.BrowserPlugin' "$PLUGINS"
          # مشروع الرجوع يجب أن يُبنى فعلاً داخل الحزمة (وإلا لا OnBackPressedCallback)
          grep -q "project(':capacitor-app')" android/capacitor.settings.gradle
          grep -q "implementation project(':capacitor-app')" android/app/capacitor.build.gradle
      - name: تجهيز الصلاحيات والأيقونات (سكربت idempotent)
        run: |
          set -euo pipefail
          node scripts/prepare-android.mjs
          # إعادة التشغيل للتأكد من أن السكربت قابل للتكرار دون تكرار الوسوم
          cp android/app/src/main/AndroidManifest.xml /tmp/manifest.first.xml
          (cd android/app/src/main/res && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/res.first.txt
          node scripts/prepare-android.mjs
          diff -q /tmp/manifest.first.xml android/app/src/main/AndroidManifest.xml
          # ولا يغيّر أي مورد (أيقونات/شاشة بدء) في التشغيل الثاني
          (cd android/app/src/main/res && find . -type f -print0 | sort -z | xargs -0 sha256sum) | diff - /tmp/res.first.txt
      - name: التحقق من صلاحيات المصدر قبل البناء
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"
          grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
          # وسم app_name مرة واحدة بالضبط: التكرار يُفشل MergeResources في Gradle
          test "$(grep -c 'name="app_name"' android/app/src/main/res/values/strings.xml)" = "1"
          grep -q '<string name="app_name">' android/app/src/main/res/values/strings.xml
          grep -q 'android:name="android.permission.POST_NOTIFICATIONS"' "$MANIFEST"
          # أيقونة الإشعارات ومسارات المزوّد منسوخة من أصل المستودع بلا تعديل
          diff -q resources/android/ic_stat_agri.xml android/app/src/main/res/drawable/ic_stat_agri.xml
          diff -q resources/android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          # أيقونة التطبيق وشاشة البدء منسوخة كما هي من resources/android/res
          # (وإلا يُبنى الـ APK بأيقونة Capacitor الافتراضية)
          RES=android/app/src/main/res
          ICON_DIFF="$(diff -rq resources/android/res "$RES" | grep -v "^Only in $RES" || true)"
          if [ -n "$ICON_DIFF" ]; then
            echo "::error::موارد أيقونة التطبيق غير منسوخة كما هي من resources/android/res"
            echo "$ICON_DIFF"
            exit 1
          fi
          grep -q '<monochrome android:drawable="@drawable/ic_launcher_monochrome"' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          # صور splash.png من القالب محذوفة: بقاؤها بجانب splash.xml مورد مكرر يُفشل البناء
          LEFTOVER_SPLASH="$(find "$RES" -path '*/drawable*' -name 'splash.png')"
          if [ -n "$LEFTOVER_SPLASH" ]; then
            echo "::error::بقيت صور شاشة البدء القديمة من قالب Capacitor"
            echo "$LEFTOVER_SPLASH"
            exit 1
          fi
          # مزوّد الملفات الذي يتطلبه @capacitor/share (بدونه تفشل مشاركة PDF/النسخ)
          grep -q 'androidx.core.content.FileProvider' "$MANIFEST"
          grep -qF 'android:authorities="${applicationId}.fileprovider"' "$MANIFEST"
          grep -qF 'android:resource="@xml/file_paths"' "$MANIFEST"
      - name: التحقق من إعدادات SDK (الإشعارات تحتاج targetSdk 33+)
        run: |
          set -euo pipefail
          FILE=android/variables.gradle
          test -f "$FILE"
          TARGET=$(grep -oE 'targetSdkVersion = [0-9]+' "$FILE" | grep -oE '[0-9]+')
          COMPILE=$(grep -oE 'compileSdkVersion = [0-9]+' "$FILE" | grep -oE '[0-9]+')
          echo "compileSdk=$COMPILE targetSdk=$TARGET"
          test "$TARGET" -ge 33
          test "$COMPILE" -ge 34
      - name: Gradle release build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Sign APK (production key or CI fallback)
        run: |
          set -euo pipefail
          UNSIGNED="$(find android/app/build/outputs/apk/release -name '*-release-unsigned.apk' -print -quit)"
          test -n "$UNSIGNED" || { echo 'No unsigned release APK produced'; exit 1; }
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/*/zipalign | tail -1)"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.p12
            ALIAS="${KEYSTORE_KEY_ALIAS:?KEYSTORE_KEY_ALIAS is required}"
            STOREPASS="${KEYSTORE_STORE_PASSWORD:?KEYSTORE_STORE_PASSWORD is required}"
            KEYPASS="${KEYSTORE_KEY_PASSWORD:-$STOREPASS}"
            KEYSTORE_TYPE=PKCS12
            KEYSTORE_FILE=release.p12
            KEYMODE="production"
          else
            ALIAS=ci-release
            STOREPASS=ci-password
            KEYPASS=ci-password
            KEYSTORE_TYPE=JKS
            KEYSTORE_FILE=release.jks
            keytool -genkeypair -keystore "$KEYSTORE_FILE" -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=GitHub Actions, OU=CI, O=TechTouch AI, C=IQ"
            KEYMODE="ci-temporary"
          fi
          mkdir -p artifacts/android
          "$ZIPALIGN" -f 4 "$UNSIGNED" artifacts/android/aligned.apk
          "$APKSIGNER" sign --ks "$KEYSTORE_FILE" --ks-type "$KEYSTORE_TYPE" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" \
            --out artifacts/android/OfficeManager-Android.apk artifacts/android/aligned.apk
          "$APKSIGNER" verify --verbose artifacts/android/OfficeManager-Android.apk
          echo "signed with: $KEYMODE" >> "$GITHUB_STEP_SUMMARY"
      - name: التحقق من الصلاحيات والأيقونة والمزوّد داخل APK المبني
        run: |
          set -euo pipefail
          APK=artifacts/android/OfficeManager-Android.apk
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)"

          # تحقق صريح يطبع ما يبحث عنه عند الفشل، بدل grep صامت يفشل بلا سبب واضح
          require() { # require <ملف> <نمط> <وصف>
            if grep -qE "$2" "$1"; then
              echo "✔ $3"
            else
              echo "::error::$3 — لم يُعثر على النمط «$2» في $1"
              grep -m 10 -E "$2" "$1" || sed -n '1,25p' "$1"
              exit 1
            fi
          }

          "$AAPT2" dump permissions "$APK" > apk-permissions.txt
          cat apk-permissions.txt
          require apk-permissions.txt 'android\.permission\.POST_NOTIFICATIONS' 'صلاحية الإشعارات'
          require apk-permissions.txt 'android\.permission\.READ_EXTERNAL_STORAGE' 'صلاحية قراءة التخزين (أندرويد ≤12)'

          "$AAPT2" dump resources "$APK" > apk-resources.txt
          require apk-resources.txt 'ic_stat_agri' 'أيقونة الإشعارات ضمن الموارد'
          require apk-resources.txt 'xml/file_paths' 'مورد مسارات المزوّد ضمن الموارد'
          # أيقونة التطبيق من المستودع (الطبقة أحادية اللون وشعار البدء لا يوجدان في قالب Capacitor)
          require apk-resources.txt 'drawable/ic_launcher_monochrome' 'طبقة الأيقونة أحادية اللون (الأيقونات ذات السمة)'
          require apk-resources.txt 'mipmap/ic_launcher_round' 'الأيقونة الدائرية'
          require apk-resources.txt 'drawable/splash_logo' 'شعار شاشة البدء'
          grep -A3 -E ' drawable/splash$' apk-resources.txt > apk-splash.txt || true
          require apk-splash.txt 'type=XML' 'شاشة البدء متجهة (splash.xml) لا صورة ممطوطة'

          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > apk-manifest.txt
          require apk-manifest.txt 'usesCleartextTraffic' 'منع النص الصريح'
          # مزوّد مشاركة الملفات من @capacitor/share (لازم لحفظ/مشاركة PDF والنسخ)
          require apk-manifest.txt 'androidx\.core\.content\.FileProvider' 'مزوّد الملفات داخل المانيفست المدمج'
          require apk-manifest.txt '\.fileprovider' 'سلطة مزوّد الملفات'

          # قائمة محتوى الحزمة تُكتب في ملف: الأنابيب مع `grep -q` تُسبّب SIGPIPE
          # فيفشل الأمر بسبب pipefail حتى عند نجاح التحقق
          # إضافة الرجوع: القائمة المسجَّلة داخل الحزمة + الصنف نفسه في dex.
          # وجودها هو الفرق بين «رجوع لصفحة سابقة/حوار تأكيد» و«إنهاء فوري للتطبيق».
          unzip -p "$APK" assets/capacitor.plugins.json > apk-plugins.json
          cat apk-plugins.json
          require apk-plugins.json 'com\.capacitorjs\.plugins\.app\.AppPlugin' 'تسجيل إضافة الرجوع (AppPlugin) داخل الحزمة'
          require apk-plugins.json 'com\.capacitorjs\.plugins\.browser\.BrowserPlugin' 'تسجيل فتح الروابط الخارجية عبر المتصفح الآمن'
          mkdir -p apk-dex
          unzip -o -q "$APK" 'classes*.dex' -d apk-dex
          if grep -rqa 'capacitorjs/plugins/app/AppPlugin' apk-dex; then
            echo "✔ صنف AppPlugin مُدمج في dex الحزمة (OnBackPressedCallback مسجَّل على الجهاز)"
          else
            echo "::error::صنف AppPlugin غير موجود في dex — زر الرجوع سيعود لسلوك النظام (إنهاء التطبيق)"
            exit 1
          fi

          unzip -l "$APK" > apk-entries.txt
          head -5 apk-entries.txt
          require apk-entries.txt 'assets/public/index\.html' 'واجهة الويب داخل الحزمة'
      - uses: actions/upload-artifact@v7
        with:
          name: OfficeManager-Android
          path: artifacts/android/OfficeManager-Android.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows 10/11 EXE (installer + portable)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installer + portable EXE (x64 + arm64) with signing
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ── تجهيز شهادة التوقيع ────────────────────────────────────────────────
          # electron-builder لا يقرأ إلا متغيّرات البيئة ويتوقّع ملف PKCS#12 سليماً.
          # الفشل السابق كان من نوعين: (أ) WIN_CSC_LINK كانت base64 ناقصة حرفين
          #     (6214 من 6216) فخرج الملف تالفاً، (ب) WIN_CSC_KEY_PASSWORD كانت
          #     تجزئة sha256 بدل كلمة المرور نفسها. كلاهما ينتج خطأً غامضاً من
          #     signtool أو تجاهلاً صامتاً للتوقيع. لذلك نتحقق خطوة بخطوة:
          #     1) فكّ base64 إلى ملف .pfx حقيقي على القرص
          #     2) فتحه بكلمة المرور عبر .NET (يكشف التلف/الخطأ فوراً وواضحاً)
          #     3) فحص الصلاحية والمفتاح الخاص وEKU وتوقيع codeSigning
          #     4) إدخال الشهادة الذاتية في مخزن الموثوقين ليصير التحقق Valid
          #     5) تمرير *مسار الملف* للـ builder لا الـ base64 (فكّ ترميز مرتين)
          $signingActive = $false
          $certThumbprint = ''
          Remove-Item Env:CSC_LINK, Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          if (-not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'OfficeManager-CodeSign.pfx'
            try {
              $b64 = $env:WIN_CSC_LINK.Trim()
              if ($b64 -match '^data:[^;]*;base64,') { $b64 = $b64 -replace '^data:[^;]*;base64,', '' }
              $pfxBytes = [Convert]::FromBase64String($b64)
              [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

              if ([System.Security.Cryptography.X509Certificates.X509CertificateLoader] -as [type]) {
                $cert = [System.Security.Cryptography.X509Certificates.X509CertificateLoader]::LoadPkcs12($pfxBytes, $env:WIN_CSC_KEY_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet)
              } else {
                $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxBytes, $env:WIN_CSC_KEY_PASSWORD)
              }
              if (-not $cert.HasPrivateKey) { throw 'ملف PKCS#12 لا يحتوي مفتاحاً خاصاً' }
              if ($cert.NotAfter -lt (Get-Date)) { throw "الشهادة منتهية الصلاحية منذ $($cert.NotAfter.ToString('yyyy-MM-dd'))" }
              if ($cert.NotBefore -gt (Get-Date)) { throw "الشهادة لم تبدأ صلاحيتها بعد $($cert.NotBefore.ToString('yyyy-MM-dd'))" }
              # ملاحظة: الخاصية الصحيحة في .NET هي EnhancedKeyUsages (بالجمع)،
              # وليس EnhancedKeyUselist — الخطأ الإملائي كان يجعل الحلقة لا تعمل
              # فيُرفض أي شهادة سليمة برسالة "لا تحمل EKU codeSigning" رغم وجوده.
              $codeSigningOid = '1.3.6.1.5.5.7.3.3'
              $hasCodeSigning = $false
              foreach ($ext in $cert.Extensions) {
                if ($ext -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
                  foreach ($u in $ext.EnhancedKeyUsages) {
                    if ($u.Value -eq $codeSigningOid) { $hasCodeSigning = $true; break }
                  }
                }
                # مسار احتياطي: بعض الشهادات تصل كـ X509Extension عام دون التحويل
                if (-not $hasCodeSigning -and $ext.Oid -and $ext.Oid.Value -eq '2.5.29.37') {
                  $formatted = $ext.Format($true)
                  if ($formatted -match '1\.3\.6\.1\.5\.5\.7\.3\.3|Code Signing') { $hasCodeSigning = $true }
                }
              }
              if (-not $hasCodeSigning) {
                $ekuDump = ($cert.Extensions | ForEach-Object { "$($_.Oid.Value)=$($_.Format($false))" }) -join '; '
                throw "الشهادة لا تحمل امتداداً موسّعاً لتوقيع الشيفرة (EKU codeSigning). الامتدادات: $ekuDump"
              }

              $signingActive = $true
              $certThumbprint = $cert.Thumbprint
              Write-Host "✔ شهادة التوقيع: $($cert.Subject)"
              Write-Host "  البصمة  : $certThumbprint"
              Write-Host "  الصلاحية: $($cert.NotBefore.ToString('yyyy-MM-dd')) ⇐ $($cert.NotAfter.ToString('yyyy-MM-dd'))"
              Write-Host "  الحجم   : $($pfxBytes.Length) بايت"

              # الشهادة ذاتية التوقيع: بدون إدخالها في مخزن الموثوقين ترجع
              # Get-AuthenticodeSignature الحالة UnknownError بدل Valid، وهو لا
              # يعكس سلامة التوقيع بل انعدام الثقة فقط. الإدخال على العدّاء
              # لحظي (ephemeral) ولا يُلمس به شيء خارجه.
              try {
                $pubBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
                $pub = if ([System.Security.Cryptography.X509Certificates.X509CertificateLoader] -as [type]) {
                  [System.Security.Cryptography.X509Certificates.X509CertificateLoader]::LoadCertificate($pubBytes)
                } else {
                  New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pubBytes)
                }
                $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
                $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
                $store.Add($pub)
                $store.Close()
                Write-Host '✔ أُضيفت الشهادة إلى Root/CurrentUser — التحقق من التوقيع سيُرجع Valid'
              } catch {
                Write-Host "::warning::تعذّر إدخال الشهادة في مخزن الموثوقين: $($_.Exception.Message)"
              }

              # نمرّر مسار الملف في المتغيّرات الاثنتين (CSC_LINK و WIN_CSC_LINK)
              # لأن electron-builder يقرأ أحدهما بحسب الإصدار/المنصّة. المسار
              # يجعل signtool يستخدم /f مباشرة بلا فكّ ترميز ثانٍ.
              Set-Item -Path Env:CSC_LINK -Value $pfxPath
              Set-Item -Path Env:WIN_CSC_LINK -Value $pfxPath
              if (-not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
                Set-Item -Path Env:CSC_KEY_PASSWORD -Value $env:WIN_CSC_KEY_PASSWORD
              }
            } catch {
              Write-Host "::error::تعذّر تجهيز شهادة التوقيع: $($_.Exception.Message)"
              $signingActive = $false
              # امنع electron-builder من محاولة التوقيع بشهادة تالفة/خاطئة
              Remove-Item Env:WIN_CSC_LINK, Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            }
          }
          if ($signingActive) {
            Write-Host '→ التوقيع مفعّل: كل نواتج ويندوز (مثبّت + محمول، x64 + arm64) ستُوقَّع.'
          } else {
            Write-Host '::warning::لن يجري توقيع نواتج ويندوز. فعّل ذلك بضبط السرّين: WIN_CSC_LINK = base64 ملف PKCS#12 كامل، وWIN_CSC_KEY_PASSWORD = كلمة المرور نصاً (لا التجزئة).'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNING_ACTIVE=$($signingActive.ToString().ToLowerInvariant())"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNING_THUMBPRINT=$certThumbprint"
          # البناء لمعماريات النشر التي يدعمها Electron 44: x64 (ويندوز 10/11 64-بت)
          # وarm64 (Windows on ARM). ملاحظة: Electron 44 أوقف نشر ثنائيات ويندوز
          # 32-بت (win32-ia32) نهائياً (electron/electron#52326)، فلم يعد ممكناً بناء
          # مثبّت لأجهزة 32-بت بهذه السلسلة — تُغطّى عبر نسخة الويب (PWA).
          $ebLog = Join-Path $env:RUNNER_TEMP 'electron-builder.log'
          & npx electron-builder --win nsis portable --x64 --arm64 --publish=never --config electron-builder.json 2>&1 | Tee-Object -FilePath $ebLog
          $ebExit = $LASTEXITCODE
          if ($ebExit -ne 0) {
            # أبرز سطور الفشل كتعليقات قابلة للقراءة عبر API (السجل الكامل في ملف المهمة)
            $errLines = Get-Content $ebLog | Select-String -Pattern '⨯|error|Error|failed|Cannot|Unable' | Select-Object -First 12
            foreach ($line in $errLines) { Write-Host "::error::electron-builder: $($line.Line.Trim())" }
            Write-Error "فشل electron-builder برمز الخروج $ebExit — راجع التعليقات أعلاه"
          }
      - name: التحقق من المنتجات (مثبّت + محمول لكل المعماريات + asar + التوقيع)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          $expected = @(
            @{Pattern='OfficeManager-Setup-*-x64.exe';    Label='مثبّت nsis x64'},
            @{Pattern='OfficeManager-Portable-*-x64.exe'; Label='نسخة محمولة x64'},
            @{Pattern='OfficeManager-Setup-*-arm64.exe';  Label='مثبّت nsis arm64'},
            @{Pattern='OfficeManager-Portable-*-arm64.exe';Label='نسخة محمولة arm64'}
          )
          $found = @()
          foreach ($e in $expected) {
            $f = Get-ChildItem release -Recurse -Filter $e.Pattern -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $f) { Write-Error "لم يُنتج electron-builder: $($e.Label) ($($e.Pattern))" }
            Write-Host ("{0,-38} {1,12:N0} بايت  {2}" -f ("✔ " + $e.Label), $f.Length, $f.Name)
            $found += $f
          }
          # ── التحقق من توقيع Authenticode ───────────────────────────────────────
          # المقصود: electron-builder يوقّع (أ) الملف التنفيذي داخل win-unpacked،
          # و(ب) مثبّت NSIS و(ج) النسخة المحمولة (NsisTarget ينفّذ packager.sign
          # على الـ installerPath لكل منهما). لذلك نتحقق من الأربعة كلها.
          # إن كانت الشهادة صالحة (SIGNING_ACTIVE=true) فأي نقص في التوقيع خطأ
          # يُفشل البناء — لا نكتفي بتحذير ونُخرج حزمة غير موقّعة باسم المشروع.
          $signingRequired = ($env:SIGNING_ACTIVE -eq 'true')
          $unsigned = @()
          $signerSubject = ''
          $signerThumbprint = ''
          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add(('-' * 78))
          $report.Add(('  {0,-34} {1,-12} {2}' -f 'الملف', 'الحالة', 'الختم الزمني'))
          $report.Add(('-' * 78))
          $signTargets = @($found)
          $mainExe = Get-ChildItem release -Recurse -Filter 'win-unpacked/*.exe' -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          if ($mainExe) { $signTargets += $mainExe }
          foreach ($t in $signTargets) {
            $sig = Get-AuthenticodeSignature $t.FullName
            $stamp = if ($sig.TimeStamperCertificate) { 'نعم' } else { 'لا' }
            $report.Add(('  {0,-34} {1,-12} {2}' -f $t.Name, [string]$sig.Status, $stamp))
            if (-not $sig.SignerCertificate) {
              $unsigned += $t.Name
              continue
            }
            # الشهادة ذاتية التوقيع: بعد إدخالها في Root/CurrentUser يجب أن تعطي
            # Status=Valid. هنا نتحقق أن المُوقِّع هو الشهادة المتوقعة تحديداً،
            # فلا يمرّ توقيعٌ بشهادة أخرى أو ملف تالف بلا سلسلة صالحة.
            if (-not $signerThumbprint) {
              $signerSubject = $sig.SignerCertificate.Subject
              $signerThumbprint = $sig.SignerCertificate.Thumbprint
            }
            if ($env:SIGNING_THUMBPRINT -and $sig.SignerCertificate.Thumbprint -ne $env:SIGNING_THUMBPRINT) {
              Write-Error "توقيع غير متوقع على $($t.Name): $($sig.SignerCertificate.Thumbprint) ≠ $($env:SIGNING_THUMBPRINT)"
            }
            if ($stamp -eq 'لا') {
              Write-Host "::warning::$($t.Name): توقيع بلا ختم زمني (RFC3161) — لن يبقى صالحاً بعد انتهاء الشهادة"
            }
          }
          $report | ForEach-Object { Write-Host $_ }
          if ($signerThumbprint) {
            Write-Host "  المُوقِّع: $signerSubject"
            Write-Host "  البصمة : $signerThumbprint"
          }
          if ($signingRequired) {
            if ($unsigned.Count -gt 0) {
              foreach ($u in $unsigned) { Write-Host "::error::غير موقّع رغم توفّر شهادة صالحة: $u" }
              Write-Error "فشل التوقيع: $($unsigned.Count) من $($signTargets.Count) ملف بلا توقيع Authenticode"
            } else {
              Write-Host "✔ كل الملفات ($($signTargets.Count)) موقّعة بالبصمة $($env:SIGNING_THUMBPRINT)"
            }
          } elseif ($unsigned.Count -gt 0) {
            Write-Host "::warning::التوقيع غير مفعّل في هذا البناء — $($unsigned.Count) من $($signTargets.Count) ملف بلا توقيع (وضع متوقّع عند غياب WIN_CSC_LINK)"
          }
          $asar = 'release/win-unpacked/resources/app.asar'
          if (-not (Test-Path $asar)) { Write-Error 'ملف app.asar غير موجود في win-unpacked' }
          npx --yes @electron/asar list $asar | Out-File asar-list.txt
          # asar list تطبع الفواصل بنمط النظام (\ على ويندوز) فنوحّدها قبل المقارنة
          $entries = Get-Content asar-list.txt | ForEach-Object { $_.Trim() -replace '\\', '/' }
          foreach ($required in @('/dist/index.html', '/electron/main.cjs', '/electron/preload.cjs', '/resources/icon/app.ico')) {
            if ($entries -notcontains $required) { Write-Error "محتوى asar ينقصه: $required" }
          }
          Copy-Item $found -Destination artifacts/windows
          Write-Host ''
          Write-Host 'النواتج النهائية في artifacts/windows:'
          Get-ChildItem artifacts/windows | Format-Table Name, Length -AutoSize

      - name: تشغيل النسخة المحمولة فعلياً (اختبار دخان على ويندوز)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Get-ChildItem release -Recurse -Filter 'OfficeManager-Portable-*-x64.exe' | Select-Object -First 1
          if (-not $portable) { Write-Error 'لا توجد نسخة محمولة لتشغيلها' }
          $proc = Start-Process -FilePath $portable.FullName -ArgumentList '--smoke-test','--no-sandbox' -PassThru
          if (-not $proc.WaitForExit(180000)) { $proc.Kill(); Write-Error 'انتهت مهلة اختبار دخان النسخة المحمولة' }
          if ($proc.ExitCode -ne 0) { Write-Error "فشل اختبار دخان النسخة المحمولة (رمز الخروج $($proc.ExitCode))" }
          Write-Host '✔ النسخة المحمولة تعمل وتحمّل الواجهة والجسر'

      - name: تثبيت المثبّت صامتاً وتشغيل النسخة المثبّتة
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem release -Recurse -Filter 'OfficeManager-Setup-*-x64.exe' | Select-Object -First 1
          if (-not $setup) { Write-Error 'لا يوجد مثبّت NSIS' }
          $installProc = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($installProc.ExitCode -ne 0) { Write-Error "فشل تثبيت NSIS (رمز $($installProc.ExitCode))" }
          Start-Sleep -Seconds 5
          $asar = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'app.asar' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $asar) { Write-Error 'لم يُعثر على التطبيق المثبّت (app.asar مفقود)' }
          $appDir = Split-Path (Split-Path $asar.FullName -Parent) -Parent
          $exe = Get-ChildItem $appDir -Filter '*.exe' | Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          if (-not $exe) { Write-Error 'لم يُعثر على ملف التطبيق التنفيذي بعد التثبيت' }
          if ($exe.Name -ne 'OfficeManager.exe') { Write-Error "اسم التنفيذ غير متوقع: $($exe.Name)" }
          $run = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test','--no-sandbox' -PassThru
          if (-not $run.WaitForExit(180000)) { $run.Kill(); Write-Error 'انتهت مهلة اختبار دخان النسخة المثبّتة' }
          if ($run.ExitCode -ne 0) { Write-Error "فشل اختبار دخان النسخة المثبّتة (رمز $($run.ExitCode))" }

      - name: إلغاء التثبيت مع التحقق من بقاء بيانات المكتب
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appDataBefore = Get-ChildItem $env:APPDATA -Recurse -Directory -Filter 'IndexedDB' -Depth 3 -ErrorAction SilentlyContinue
          if (-not $appDataBefore) { Write-Error 'لم تُنشئ النسخة المثبّتة قاعدة بيانات محلية (IndexedDB)' }
          $uninstaller = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { Write-Error 'ملف إلغاء التثبيت غير موجود' }
          $uninstallProc = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait
          if ($uninstallProc.ExitCode -ne 0) { Write-Error "فشل إلغاء التثبيت (رمز $($uninstallProc.ExitCode))" }
          Start-Sleep -Seconds 5
          $appDataAfter = Get-ChildItem $env:APPDATA -Recurse -Directory -Filter 'IndexedDB' -Depth 3 -ErrorAction SilentlyContinue
          if (-not $appDataAfter) { Write-Error 'حُذفت بيانات المكتب عند إلغاء التثبيت — يجب أن تبقى' }
          Write-Host '✔ مثبّت ويتعامل مع البيانات كما هو متوقع (تبقى بعد إلغاء التثبيت)'
      - uses: actions/upload-artifact@v7
        with:
          name: OfficeManager-Windows
          path: artifacts/windows/*.exe
          if-no-files-found: error
          retention-days: 30

  tauri-linux:
    name: Tauri (Linux bundles — التحقق من الإعداد والبناء الفعلي)
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: اعتماديات نظام Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm --prefix desktop ci
      - name: بناء حزم Tauri (deb + AppImage)
        run: npm --prefix desktop run build -- --bundles deb,appimage
      - name: التحقق من وجود الحزم والواجهة داخلها
        run: |
          set -euo pipefail
          ls -la desktop/src-tauri/target/release/bundle
          # نسخة الواجهة المبنية التي غلّفها Tauri (تُدمج داخل الملف التنفيذي عند البناء)
          test -f desktop/src-tauri/dist/index.html
          grep -q 'id="root"' desktop/src-tauri/dist/index.html
          ls -la desktop/src-tauri/dist/assets

          DEB="$(find desktop/src-tauri/target/release/bundle -name '*.deb' -print -quit)"
          APPIMAGE="$(find desktop/src-tauri/target/release/bundle -name '*.AppImage' -print -quit)"
          test -n "$DEB"
          test -n "$APPIMAGE"

          # بيانات الحزمة ومحتواها (القائمة في متغير: grep -q يغلق الأنبوب فيُسبّب
          # SIGPIPE ويفشل الأمر بسبب pipefail رغم صحة الملف)
          dpkg-deb -f "$DEB" Package Version Architecture
          DEB_LIST="$(dpkg-deb -c "$DEB")"
          if ! grep -Eq 'usr/(bin|lib)/' <<< "$DEB_LIST"; then
            echo "::error::حزمة deb لا تحتوي ملفات التنفيذ المتوقعة"
            sed -n '1,20p' <<< "$DEB_LIST"
            exit 1
          fi
          grep -E 'usr/(bin|lib)/' <<< "$DEB_LIST" | sed -n '1,5p'

          # الملف التنفيذي داخل الحزمة يجب أن يحتوي واجهة التطبيق المدمجة فعلاً.
          #
          # Tauri يضغط محتوى الأصول المدمجة بـ Brotli داخل الثنائي، فلا يُجدى البحث
          # عن نص الصفحة (`id="root"`) في الثنائي — الدليل القاطع هو وجود **أسماء**
          # الأصول المُنتَجة بتجزئة محتواها (index-<hash>.js/css و index.html) داخل
          # الثنائي، فهي مفاتيح خريطة الأصول المدمجة وقت البناء.
          ASSETS_DIR=desktop/src-tauri/dist/assets
          ASSET_JS="$(basename "$(find "$ASSETS_DIR" -name 'index-*.js' -print -quit)")"
          ASSET_CSS="$(basename "$(find "$ASSETS_DIR" -name 'index-*.css' -print -quit)")"
          test -n "$ASSET_JS"
          test -n "$ASSET_CSS"
          ls "$ASSETS_DIR" | tr '\n' ' '
          echo

          TMP="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$TMP"
          # اسم الثنائي يأتي من productName في tauri.conf.json؛ نقبل الاسمين حتى لا
          # يتعلق التحقق باسم العرض (قد يتغيّر مستقبلاً بلا علاقة بالبناء).
          BIN="$(find "$TMP" -type f -perm -u+x \( -name 'agro-office*' -o -name 'office-manager*' \) -print -quit)"
          test -n "$BIN"
          echo "binary=$BIN size=$(stat -c%s "$BIN")"
          for ASSET in "$ASSET_JS" "$ASSET_CSS" index.html; do
            if grep -qaF "$ASSET" "$BIN"; then
              echo "✔ الأصل المدمج: $ASSET"
            else
              echo "::error::الأصل $ASSET غير موجود داخل الثنائي — الواجهة لم تُدمج في البناء"
              exit 1
            fi
          done

          # والـ AppImage ملف تنفيذي صالح بحجم معقول
          test -s "$APPIMAGE"
          file "$APPIMAGE"
          head -c 4 "$APPIMAGE" > appimage-magic.txt
          if ! grep -qa 'ELF' appimage-magic.txt; then
            echo "::error::ملف AppImage لا يبدأ بترويسة ELF"
            od -An -tx1 appimage-magic.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: OfficeManager-Tauri-Linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 30

  tauri-windows:
    name: Tauri (Windows bundles)
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm --prefix desktop ci
      - name: بناء حزم Tauri (msi + nsis)
        shell: pwsh
        run: |
          $tbLog = Join-Path $env:RUNNER_TEMP 'tauri-build.log'
          & npm --prefix desktop run build -- --bundles msi,nsis 2>&1 | Tee-Object -FilePath $tbLog
          $tbExit = $LASTEXITCODE
          if ($tbExit -ne 0) {
            # ذيّل السجل كاملاً (آخر 60 سطراً) كتعليقات قابلة للقراءة عبر API —
            # رسالة فشل سكربت البناء الحقيقي تأتي عادة بعد أسطر "failed to build"
            $tail = Get-Content $tbLog | Select-Object -Last 60
            foreach ($line in $tail) { Write-Host "::error::tauri-build: $($line.Trim())" }
            Write-Error "فشل بناء Tauri برمز الخروج $tbExit — راجع التعليقات أعلاه"
          }
      - name: التحقق من وجود الحزم
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundles = Get-ChildItem desktop/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe -ErrorAction SilentlyContinue
          $bundles | Format-Table FullName, Length
          if (-not ($bundles | Where-Object { $_.Extension -eq '.msi' })) { Write-Error 'لم يُنتج Tauri حزمة msi' }
          if (-not ($bundles | Where-Object { $_.Extension -eq '.exe' })) { Write-Error 'لم يُنتج Tauri حزمة nsis' }
      - name: تشغيل ثنائي Tauri (اختبار دخان بلا صندوق حفظ)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem desktop/src-tauri/target/release -Filter 'office-manager.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error 'لم يُعثر على office-manager.exe' }
          $log = Join-Path $env:TEMP 'office-manager-smoke.txt'
          # اختبار الدخان يعتمد على توقيت إقلاع WebView2 ورسم الواجهة، وهو عرضة
          # للتذبذب على عدّاءات CI. نعيد المحاولة حتى 3 مرات قبل إعلان الفشل،
          # مع طباعة سجل آخر محاولة للتشخيص في كل الأحوال.
          $attempt = 0
          $maxAttempts = 3
          $succeeded = $false
          $lastDetail = ''
          while ($attempt -lt $maxAttempts -and -not $succeeded) {
            $attempt++
            Write-Host "--- محاولة اختبار الدخان $attempt من $maxAttempts ---"
            Remove-Item $log -ErrorAction SilentlyContinue
            # نظّف أي عملية عالقة من محاولة سابقة حتى لا يتدخل قفل النسخة الواحدة
            # أو قفل مجلد بيانات WebView2 (عمليات الويب فيو أبناء مستقلون)
            Get-Process -Name 'office-manager' -ErrorAction SilentlyContinue | Stop-Process -Force
            Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru
            $timedOut = -not $proc.WaitForExit(120000)
            if ($timedOut) { try { $proc.Kill() } catch {} }
            $lastDetail = if (Test-Path $log) { (Get-Content $log -Raw).Trim() } else { '(لا يوجد ملف سجل)' }
            Write-Host "سجل الدخان: $lastDetail"
            if (-not $timedOut -and $proc.ExitCode -eq 0) {
              $succeeded = $true
            } else {
              $reason = if ($timedOut) { 'انتهاء المهلة (90 ثانية داخلية)' } else { "رمز الخروج $($proc.ExitCode)" }
              Write-Host "المحاولة $attempt فشلت ($reason)"
              Write-Host "::error::دخان Tauri محاولة $attempt/$maxAttempts — $reason — السجل: $lastDetail"
              if ($attempt -lt $maxAttempts) { Start-Sleep -Seconds 5 }
            }
          }
          if (-not $succeeded) { Write-Error "فشل اختبار دخان Tauri بعد $maxAttempts محاولات — آخر سجل: $lastDetail" }
          Write-Host '✔ Tauri يرسم الواجهة وقناة IPC غير محجوبة'
      - name: حفظ Cargo.lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: desktop/src-tauri/Cargo.lock
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: OfficeManager-Tauri-Windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android, windows, tauri-linux, tauri-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
