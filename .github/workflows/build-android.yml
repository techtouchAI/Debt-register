name: Build Android APK

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK (بدون انترنت)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npm install @capacitor/filesystem @capacitor/local-notifications --save || true

      - name: Build Web App (PWA - Offline)
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          ls -la android/ || true

      - name: Sync Capacitor
        run: |
          npx cap sync android || true

      - name: Build Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || ./gradlew assembleDebug

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgriOffice-Android-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### Android Build Summary" >> $GITHUB_STEP_SUMMARY
          ls -lh android/app/build/outputs/apk/debug/ 2>&1 || echo "No APK yet"
