[package]
name = "agro-office"
version = "1.0.0"
description = "Offline agricultural office and debt manager"
authors = ["TechTouch AI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agro_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# قفل النسخة الوحيدة: سطح المكتب فقط (أندرويد/iOS لا يحتاجانه)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
