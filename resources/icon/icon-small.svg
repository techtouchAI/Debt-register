<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- نسخة مبسّطة من أيقونة «إدارة المكتب» للأحجام الصغيرة جداً (16–40 بكسل):
       عناصر أقل وأسمك، محاذاة على شبكة 64 وحدة (= 1 بكسل عند 16×16) وبلا ظلال. -->
  <defs>
    <linearGradient id="sm-fill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#839d6b"/>
      <stop offset="0.55" stop-color="#5a7447"/>
      <stop offset="1" stop-color="#34452b"/>
    </linearGradient>
    <linearGradient id="sm-seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9bd88"/>
      <stop offset="1" stop-color="#9c7a48"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sm-fill)"/>
  <!-- الوصل -->
  <path d="M404,112 H748 Q792,112 792,156 V752 L738,812 L684,752 L630,812 L576,752 L522,812 L468,752 L414,812 L360,752 V156 Q360,112 404,112 Z" fill="#fbf8f2"/>
  <!-- العنوان وسطران -->
  <rect x="464" y="224" width="256" height="64" rx="32" fill="#b8965f"/>
  <rect x="528" y="352" width="192" height="64" rx="32" fill="#8d877e"/>
  <rect x="592" y="480" width="128" height="64" rx="32" fill="#8d877e"/>
  <!-- ختم «تم التسديد» -->
  <circle cx="384" cy="752" r="184" fill="#fbf9f4"/>
  <circle cx="384" cy="752" r="148" fill="url(#sm-seal)"/>
  <path d="M324,756 L370,802 L454,706" fill="none" stroke="#ffffff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
