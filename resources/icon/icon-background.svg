<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- خلفية أيقونة «إدارة المكتب»: تدرّج أخضر مريمي + لمعة علوية خفيفة (تمتد حتى الحواف) -->
  <defs>
    <linearGradient id="bg-fill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#839d6b"/>
      <stop offset="0.55" stop-color="#5a7447"/>
      <stop offset="1" stop-color="#34452b"/>
    </linearGradient>
    <linearGradient id="bg-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg-fill)"/>
  <rect width="1024" height="1024" fill="url(#bg-sheen)"/>
</svg>
